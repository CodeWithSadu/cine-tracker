version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: cinetrack-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       movietracker
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cinetrack-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cinetrack-api
    restart: unless-stopped
    environment:
      SERVER_PORT:  "8080"
      DATABASE_URL: "postgres://postgres:password@postgres:5432/movietracker?sslmode=disable"
      REDIS_URL:    "redis://redis:6379"
      JWT_SECRET:   "${JWT_SECRET:-dev-secret-change-in-production-32ch}"
      TMDB_API_KEY: "${TMDB_API_KEY:-}"
      ENVIRONMENT:  "development"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: cinetrack-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
