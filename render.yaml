databases:
  - name: cinetrack-db
    plan: free
    databaseName: movietracker
    user: cinetrack

services:
  - type: web
    name: cinetrack-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cinetrack-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: TMDB_API_KEY
        sync: false
